name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

env:
  IMAGE_NAME: thesportysofia/ops-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test application
        run: |
          python -m py_compile app.py

          python app.py > /tmp/ops-api.log 2>&1 &
          PID=$!

          trap 'kill $PID' EXIT

          sleep 1

          curl --fail http://127.0.0.1:8000/health

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_KEY" | base64 --decode > ~/.ssh/ops-api-ec2
          chmod 600 ~/.ssh/ops-api-ec2

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/ops-api-ec2 ubuntu@"$EC2_HOST" \
            "IMAGE='$IMAGE' bash -s" <<'REMOTE'
              set -euo pipefail

              echo "Pulling $IMAGE..."
              docker pull "$IMAGE"

              echo "Stopping old container..."
              docker stop ops-api 2>/dev/null || true

              echo "Removing old container..."
              docker rm ops-api 2>/dev/null || true

              echo "Starting new container..."
              docker run -d \
                --name ops-api \
                --restart unless-stopped \
                -p 80:8000 \
                "$IMAGE"

              echo "Running health check..."
              sleep 2
              curl --fail http://localhost/health

              echo "Deployment successful."

              docker image prune -f
          REMOTE
